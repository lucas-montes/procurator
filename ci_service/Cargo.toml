[package]
name = "ci_service"
version = "0.1.0"
edition = "2024"

[features]
default = ["http", "sqlite", "webhook"]
# Inbound HTTP adapter (axum router). Off = embed the use cases only.
http = ["dep:axum"]
# SQLite run store adapter.
sqlite = ["dep:sqlx"]
# Outbound webhook notifier (HTTP/HTTPS client).
webhook = ["dep:reqwest"]

[[bin]]
name = "ci_service"
path = "src/main.rs"
required-features = ["http", "sqlite", "webhook"]

[dependencies]
tokio = { workspace = true, features = ["signal", "time", "io-util", "process", "sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
