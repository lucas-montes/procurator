[package]
name = "cache"
version = "0.1.0"
edition = "2024"

[features]
default = ["http", "sqlite"]
# Inbound HTTP adapter (axum router). Off = embed the use cases only.
http = ["dep:axum", "dep:tokio-util"]
# SQLite index adapter.
sqlite = ["dep:sqlx"]

[[bin]]
name = "cache"
path = "src/main.rs"
required-features = ["http", "sqlite"]

[[test]]
name = "http"
required-features = ["http"]

[[test]]
name = "nix_e2e"
required-features = ["http", "sqlite"]

[dependencies]
tokio = { workspace = true, features = ["io-util", "signal", "time"] }
futures.workspace = true
bytes = "1"
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
toml = "0.8"
uuid.workspace = true
ed25519-dalek = "2.0"
base64 = "0.21"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
axum = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
