[package]
name = "cache"
version = "0.1.0"
edition = "2024"

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
ed25519-dalek = "2.0"
base64 = "0.21"
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
# TLS (mTLS) stack, same versions as worker proxy.
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# X.509 parsing for CN allowlists + SHA-256 fingerprints for identity.
x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
# Manual TLS accept loop (reuses worker proxy pattern).
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
