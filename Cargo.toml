[package]
name = "procurator"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
capnp = "0.20.3"
capnp-rpc = "0.20.3"

tokio = { version = "1.4.0", features = ["net", "rt", "macros", "rt-multi-thread", "process", "fs", "sync"]}
tokio-util = { version = "0.7.4", features = ["compat"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

uuid = { version = "1.17.0", features = ["v7"] }

futures = "0.3.0"

sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "migrate"] }

axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

chrono = "0.4"

commands = { path = "commands" }
repo_outils = { path = "repo_outils" }
autonix = { path = "autonix" }
control_plane = { path = "control_plane" }
worker = { path = "worker" }
ci_service = { path = "ci_service" }
cache = { path = "cache" }
repohub = { path = "repohub" }

[dependencies]
# The monolith: ci_service, repohub and cache in one process (src/main.rs).
ci_service.workspace = true
cache.workspace = true
repohub.workspace = true
axum.workspace = true
toml = "0.8"
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
capnp.workspace = true
capnp-rpc.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
uuid.workspace = true
control_plane.workspace = true
worker.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[workspace]
members = ["cli", "commands", "control_plane", "worker", "console", "ci_service", "cache", "repo_outils", "repohub", "autonix"]

[workspace.lints.clippy]
all = { level = "deny" }
pedantic = { level = "deny" }

[workspace.lints.rust]
warnings = "warn"



