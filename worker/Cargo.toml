[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
capnp.workspace = true
capnp-rpc.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
commands.workspace = true
uuid.workspace = true
sqlx.workspace = true

# low-level netlink library used for attaching TAPs to bridges without spawning `ip`
rtnetlink = "0.20"
# raw libc bindings for TAP ioctl (TUNSETIFF, TUNSETPERSIST)
libc = "0.2"

# VMM / HTTP dependencies
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "server", "tokio", "http1", "http2"] }
hyperlocal = "0.9"
http-body-util = "0.1"
bytes = "1"
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["trace"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
jsonwebtoken = "9"

[lints]
workspace = true
